<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password | SellSync</title>
  <link rel="stylesheet" href="login.css?v=4" />
  <link rel="stylesheet" href="reset-email.css" />
</head>
<body>
  <div class="login-container">
    <div class="left-panel">
      <div class="brand-content">
        <h1>SellSync</h1>
        <p>One platform. Total retail control.</p>
      </div>
    </div>
    <div class="right-panel">
      <div class="form-wrapper">
        <h2>Set your new password</h2>
        <p class="subtitle">Create a strong password for your account.</p>

        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

        <form id="newPasswordForm" novalidate>
          <div class="field">
            <label for="newPassword">New Password</label>
            <div class="password-wrap">
              <input type="password" id="newPassword" name="password" required placeholder="Enter new password" minlength="8" autocomplete="new-password" />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">
                <span class="icon-eye" aria-hidden="true"></span>
                <span class="icon-eye-off" aria-hidden="true"></span>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
            <span class="caps-warning" id="capsWarning" aria-live="polite">Caps Lock is on</span>
          </div>

          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password" autocomplete="new-password" />
            <span class="field-error" id="confirmPasswordError"></span>
          </div>

          <button type="submit" class="btn-login" id="submitBtn">
            <span class="btn-text">Update Password</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

          <p class="back-to-login"><a href="login.html">Back to Sign In</a></p>
        </form>
      </div>
    </div>
  </div>
  <script src="reset-password.js"></script>
</body>
</html>
