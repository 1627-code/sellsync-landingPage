<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create your account | SellSync</title>
  <link rel="stylesheet" href="../css/signup.css" />
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-card">
      <header class="signup-header">
        <h1 class="logo">SellSync</h1>
        <p class="value-statement">Manage your sales and inventory in one place.</p>
      </header>

      <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

      <!-- Step 1: Account Creation -->
      <section class="step" id="step1" data-step="1">
        <p class="step-label">Step 1 of 3</p>
        <form id="signupFormStep1" novalidate>
          <div class="field">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="e.g. Jonh Peter" autocomplete="name" />
            <span class="field-error" id="fullNameError"></span>
          </div>
          <div class="field">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="you@mail.com" autocomplete="email" inputmode="email" />
            <span class="field-error" id="emailError"></span>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" required placeholder="Minimum 8 characters" autocomplete="new-password" minlength="8" />
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">
                <span class="icon-eye" aria-hidden="true"></span>
                <span class="icon-eye-off" aria-hidden="true"></span>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <div class="password-wrap">
              <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your password" autocomplete="new-password" />
              <button type="button" class="toggle-password" id="toggleConfirmPassword" aria-label="Show password" title="Show password">
                <span class="icon-eye" aria-hidden="true"></span>
                <span class="icon-eye-off" aria-hidden="true"></span>
              </button>
            </div>
            <span class="field-error" id="confirmPasswordError"></span>
          </div>
          <button type="submit" class="btn-primary" id="btnStep1">
            <span class="btn-text">Next</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <!-- Step 2: Business Setup -->
      <section class="step" id="step2" data-step="2" hidden>
        <p class="step-label">Step 2 of 3</p>
        <form id="signupFormStep2" novalidate>
          <div class="field">
            <label for="businessName">Business Name</label>
            <input type="text" id="businessName" name="businessName" required placeholder="What is your shop or business name?" autocomplete="organization" />
            <span class="field-error" id="businessNameError"></span>
          </div>
          <div class="field">
            <label for="businessType">Business Type</label>
            <select id="businessType" name="businessType" required aria-describedby="businessTypeError">
              <option value="">Choose one</option>
              <option value="retail">Retail Shop</option>
              <option value="minimart">Mini-Mart</option>
              <option value="pharmacy">Pharmacy</option>
              <option value="fashion">Fashion / Clothing</option>
              <option value="electronics">Electronics</option>
              <option value="cosmetics">Cosmetics</option>
              <option value="other">Other</option>
            </select>
            <span class="field-error" id="businessTypeError"></span>
          </div>
          <button type="submit" class="btn-primary" id="btnStep2">
            <span class="btn-text">Next</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <!-- Step 3: Optional -->
      <section class="step" id="step3" data-step="3" hidden>
        <p class="step-label">Step 3 of 3 — Optional</p>
        <p class="step-desc">Add these later if you prefer. You can skip and go straight to sign in.</p>
        <form id="signupFormStep3" novalidate>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="For support and SMS alerts" autocomplete="tel" inputmode="tel" />
            <span class="field-error" id="phoneError"></span>
          </div>
          <div class="field">
            <label for="location">Location (City / State)</label>
            <input type="text" id="location" name="location" placeholder="e.g. Lagos, Lagos" autocomplete="address-level2" />
            <span class="field-error" id="locationError"></span>
          </div>
          <div class="step3-actions">
            <button type="button" class="btn-skip" id="btnSkip">Skip for now</button>
            <button type="submit" class="btn-primary" id="btnStep3">
              <span class="btn-text">Save &amp; continue</span>
              <span class="btn-loader" aria-hidden="true"></span>
            </button>
          </div>
        </form>
      </section>

      <footer class="signup-footer">
        <p class="trust-note">Your data is secure and private.</p>
        <p class="login-prompt">Already have an account? <a href="/login">Log in</a></p>
      </footer>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../js/signup.js"></script>
</body>
</html>
